<form action="eposta.pl" method="POST">
<table border="0" width="450" cellspacing="0">
<tr> 
<td> Adınız: </td>

<td> 
<input type  = "text" size = "40" name = "ad">

</tr>
<tr>

<td> 
<input type = "text" size = "40" name = "kent">
</td>
</tr>
<!-------------  Seçme Kutuları  -------------> 
<tr> 
<td>Ülke: </td>
<td><select name = "ulke" size = "1">

          <option value = "ülke2">Ülke 2</option>

</select></td>

<!--------------  Seçme Kutuları Bitti  --------------> 
<tr>

</tr>
<tr> 
<td colspan = "2">&nbsp;<p><b> 
<!-------------  İşaret Kutuları  -------------> 
Hangi tür hizmetlerimizle İlgileniyorsunuz?</b><br>
          <input type = "checkbox" name = "hizmetler" value = "Program Güncellemeleri">
          Program Güncellemeleri &nbsp;&nbsp; 
          <input type = "checkbox" name = "hizmetler" value = "Teknik Yardım">Teknik Yardım</p>
<!--------------  İşaret Kutuları Bitti  --------------> 
<!------------  Radayo Düğmeleri  ------------> 
<p><b>Sitemiz güncelleştirildiğinde bilgi edinmek ister misiniz?:</b><br>
          <input type = "radio" name = "bilgi" value = "Evet" checked>Evet&nbsp;&nbsp; 
          <input type = "radio" name = "bilgi" value = "Hayır">Hayır<br>
          <br>
<!-------------  Radyo Düğmeleri Bitti  -------------> 
         <b>Bize mesajınız: </b><br>
<!---------------  Mesaj  --------------> 
<textarea name = "mesaj" rows = "6" cols = "44" wrap = "virtual"></textarea></p>
<!----------------  Mesaj Bitti  ---------------> 
<p> 
<input type = "submit" name = "submit" value = "Gönder">&nbsp;&nbsp;
<input type = "reset" name = "reset" value = " Sil ">

</tr>
